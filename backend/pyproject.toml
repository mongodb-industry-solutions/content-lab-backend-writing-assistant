[tool.poetry]
name = "your-virtual-env"
version = "0.1.0"
description = "Chatbot Components"
authors = ["Aswin aswin.subramanianmaheswaran@mongodb.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
python-dotenv = ">=1.2.2"
fastapi = ">=0.115.4"
uvicorn = ">=0.32.0"
httpx = "^0.27.2"
# Security: explicit floors for vulnerable transitive dependencies
starlette = ">=0.49.1"
urllib3 = ">=2.7.0"
idna = ">=3.15"


[tool.poetry.group.dev.dependencies]
pip-licenses = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
